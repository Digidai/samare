name: Public macOS upgrade

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-update:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Click Update in the public arm64 application and observe its relaunch
        run: python3 -u Tests/public-upgrade.py
      - name: Preserve process, accessibility and document evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-upgrade-evidence
          path: ${{ runner.temp }}/samare-upgrade-evidence
          if-no-files-found: error
          retention-days: 7
